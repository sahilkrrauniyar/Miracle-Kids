backend:
  name: git-gateway
  branch: main
  site_domain: luminous-blancmange-7a438f.netlify.app

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "notices"
    label: "Notices"
    folder: "data/notices"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "detail", widget: "text" }
      
