backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "notices"
    label: "Notices"
    files:
      - file: "data/notices.json"
        label: "Notice List"
        name: "notices_list"
        fields:
          - label: "Notices"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Details", name: "detail", widget: "text" }
